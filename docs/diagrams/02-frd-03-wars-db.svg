.2793 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="132" x="538" y="144.873">ESI id -&gt; name cache</text><!--
@startuml
title wars.db
entity wars {
  * war_id : INTEGER <<PK>>
  - -
  declared_at : TEXT (UTC)
  payload : TEXT (War as JSON)
  state : pending | sent | skipped | filtered | failed
  attempts : INTEGER
  last_error : TEXT
  first_seen_at : TEXT
  notified_at : TEXT
  discord_message_id : TEXT
  report_json : TEXT
  report_updated_at : TEXT
  attachments_json : TEXT
  live_done : INTEGER (0/1)
}
entity meta {
  * key : TEXT <<PK>>
  - -
  value : TEXT
}
entity names {
  * id : INTEGER <<PK>>
  - -
  name : TEXT
  category : TEXT
  updated_at : TEXT
}
entity structures {
  * structure_id : INTEGER <<PK>>
  - -
  owner_id : INTEGER (corporation)
  name : TEXT
  type_id : INTEGER
  solar_system_id : INTEGER
}
note right of meta : bootstrapped_at,\nwatermark_war_id,\nstructures_loaded_at / etag
note right of names : ESI id -> name cache
@enduml

