@startuml
title Story acceptance flow
[*] - -> Implemented
Implemented - -> AutoGreen : automated tests pass
AutoGreen - -> UAT : release installed\non test / production
UAT - -> Accepted : all ACs shown\n(manual scenarios + field)
UAT - -> Rework : AC fails
Rework - -> Implemented
Accepted - -> [*]
@enduml

