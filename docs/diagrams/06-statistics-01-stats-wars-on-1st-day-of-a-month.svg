80036; stroke-width: 1.0;" x1="59" x2="100" y1="385.4443" y2="385.4443"/><polygon fill="#A80036" points="69,381.4443,59,385.4443,69,389.4443,65,385.4443" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="100" x="65" y="367.3086">Markdown table</text><!--
@startuml
title stats - wars on 1st day of a month
participant "stats" as S
participant "ESI" as E
database "wars.db" as DB
S -> E : GET /wars/  (newest IDs)
loop each month
  group binary search: first war declared >= 1st 00:00 UTC
    S -> E : GET /wars/?max_war_id=mid
    S -> E : GET /wars/{id}/  (declared)
  end
  loop wars from that ID until declared >= 2nd 00:00 UTC
    S -> E : GET /wars/{id}/
  end
  S -> DB : count wars of that day (seen / sent)
end
S -> S : Markdown table
@enduml

